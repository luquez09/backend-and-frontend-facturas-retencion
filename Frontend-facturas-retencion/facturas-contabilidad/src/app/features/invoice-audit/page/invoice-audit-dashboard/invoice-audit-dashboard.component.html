<body class="h-full text-slate-700 antialiased font-sans selection:bg-brand-500 selection:text-white flex flex-col">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <div class="p-2 bg-brand-50 rounded-xl text-brand-600">
                        <i data-lucide="shield-check" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-semibold text-slate-900 leading-tight">Evolucion Contable y Tributaria
                        </h1>
                        <p class="text-xs text-slate-500">Contabilidad y Tributaria</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        <!-- Componente de Carga de Archivos -->
        <app-file-upload></app-file-upload>

        <!-- Componente de Tarjetas de Resumen -->
        <app-summary-cards></app-summary-cards>

        <!-- Componente de Tabla con Filtros -->
        <app-invoice-table (onSelectFactura)="openDetail($event)"></app-invoice-table>

        <!-- Modal Detalle (Si hay una factura seleccionada) -->
        <app-invoice-detail-modal *ngIf="selectedFactura$ | async as factura" [factura]="factura"
            (onClose)="closeDetail()">
        </app-invoice-detail-modal>

    </main>
</body>
