<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
  <h2 class="text-lg font-semibold text-slate-800 mb-2">Carga y Procesamiento de Facturas</h2>
  <p class="text-sm text-slate-500 mb-4">Sube tus archivos de facturación (JSON/XML/Excel) para ejecutar la auditoría automática DIAN.</p>

  <div class="flex flex-col md:flex-row items-center gap-4">
    <input type="file" (change)="onFileSelected($event)" accept=".json,.xml,.xlsx" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 cursor-pointer"/>
    
    <button 
      (click)="executeProcess()"
      [disabled]="!selectedFile() || (isLoading$ | async)"
      class="w-full md:w-auto px-6 py-2.5 bg-slate-900 text-white font-medium rounded-lg hover:bg-slate-800 disabled:opacity-50 transition-all flex items-center justify-center gap-2">
      <span *ngIf="(isLoading$ | async)" class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
      {{ (isLoading$ | async) ? 'Procesando...' : 'Ejecutar Auditoría' }}
    </button>
  </div>
</div>
