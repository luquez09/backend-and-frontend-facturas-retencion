<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
            <!-- Total Facturas -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-xs font-medium text-slate-500">Total Facturas</span>
                    <span class="p-2 bg-slate-100 text-slate-600 rounded-lg"><i data-lucide="file-text" class="w-4 h-4"></i></span>
                </div>
                <div class="mt-3">
                    <span id="kpiTotal" class="text-2xl font-bold text-slate-900">0</span>
                    <span class="text-xs text-slate-400 block mt-0.5">100% del lote</span>
                </div>
            </div>

            <!-- Facturas Correctas -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-xs font-medium text-slate-500">Válidas / Correctas</span>
                    <span class="p-2 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="check-circle-2" class="w-4 h-4"></i></span>
                </div>
                <div class="mt-3">
                    <span id="kpiCorrect" class="text-2xl font-bold text-emerald-700">0</span>
                    <span id="kpiCorrectPct" class="text-xs text-emerald-600 block mt-0.5">0% del total</span>
                </div>
            </div>

            <!-- Inconsistentes -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-xs font-medium text-slate-500">Con Inconsistencia</span>
                    <span class="p-2 bg-rose-50 text-rose-600 rounded-lg"><i data-lucide="alert-triangle" class="w-4 h-4"></i></span>
                </div>
                <div class="mt-3">
                    <span id="kpiInconsistent" class="text-2xl font-bold text-rose-700">0</span>
                    <span id="kpiInconsistentPct" class="text-xs text-rose-600 block mt-0.5">0% del total</span>
                </div>
            </div>

            <!-- Sin Registro Contable -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-xs font-medium text-slate-500">Sin Reg. Contable</span>
                    <span class="p-2 bg-amber-50 text-amber-600 rounded-lg"><i data-lucide="file-x" class="w-4 h-4"></i></span>
                </div>
                <div class="mt-3">
                    <span id="kpiNoAccounting" class="text-2xl font-bold text-amber-700">0</span>
                    <span id="kpiNoAccountingPct" class="text-xs text-amber-600 block mt-0.5">0% requieran ajuste</span>
                </div>
            </div>

            <!-- Desviación Financiera -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-start">
                    <span class="text-xs font-medium text-slate-500">Diferencia IVA Estimado</span>
                    <span class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="calculator" class="w-4 h-4"></i></span>
                </div>
                <div class="mt-3">
                    <span id="kpiIvaDiff" class="text-xl font-bold text-slate-900">$0</span>
                    <span class="text-xs text-slate-400 block mt-0.5">Esperado vs Real</span>
                </div>
            </div>
        </section>
